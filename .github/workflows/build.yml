name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # gradle wrapper に実行権限を付与して実行（app フォルダ内にある場合は cd app で対応）
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./app/gradlew" ]; then
            cd app
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found" && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Resolve version from tag
        id: v
        if: github.ref_type == 'tag'
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: "**/build/outputs/apk/debug/*.apk"
