name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 通常の push 時に Debug APK を作成
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ビルドされた APK を Artifacts としてアップロード（画面からダウンロード可能にする）
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/app/build/outputs/apk/debug/*.apk

      # タグ打ち時のみ Release ビルドを実行して GitHub Release に公開
      - name: Resolve version from tag
        id: v
        if: github.ref_type == 'tag'
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: app/app/build/outputs/apk/debug/*.apk
